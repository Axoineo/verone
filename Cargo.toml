[workspace]
resolver = "3"
members = ["crates/verone-core", "crates/verone-engine-container", "crates/verone-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/Axoineo/verone"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Small binaries matter more than build time for a tool people download.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
